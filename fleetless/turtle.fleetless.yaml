# SPDX-License-Identifier: Apache-2.0
#
# What the turtle exposes in Fleetless: its fleetless.yaml. Publish it on the
# robot's configuration page in the console, or over MCP. It names no role
# and has no access section, so it publishes into any organisation as it is.
#
# Every description is written for a caller who knows nothing else. It is
# what an MCP client reads before it acts, so it says what the value means,
# its range, and what the turtle does about it.
#
# The world, for whoever reads on: a square garden of 256 x 256 cells, each
# 0.1 m wide. A cell is (x, y) from 0 to 255, counted from the south-west
# corner; x grows east, y north. On top lie 16 x 16 squares of 16 x 16 cells,
# named like a chess board: the letter A to P follows x, the number 1 to 16
# follows y. The charging pad is in square A1.
fleetless: 1

datapoints:
  # --- The battery ------------------------------------------------------------
  battery_soc:
    topic: /battery_state
    type: sensor_msgs/msg/BatteryState
    field: percentage
    description: |
      Battery charge in percent, 0 to 100. Standing empties a full battery
      in an hour, driving at full speed in five minutes. On the charging
      pad in square A1 it is full again after one minute. At 0 % the turtle
      does not stop: it crawls at a tenth of its speed until the battery is
      back at 5 %.
    numeric:
      scale: 100
      unit: "%"
      decimals: 0
    retention:
      enabled: true
      interval_seconds: 10
    chart:
      y_min: 0
      y_max: 100
      style: line
    alerts:
      battery_low:
        name: Battery low
        severity: warning
        condition: { fire_at: 20, resolve_at: 25 }
      battery_empty:
        name: Battery empty
        severity: error
        condition: { fire_at: 1, resolve_at: 5 }

  on_charger:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: on_charger
    description: |
      True while the turtle stands on the charging pad in square A1. There
      the battery charges, whether the turtle moves or not.

  crawling:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: crawling
    description: |
      True while the battery is empty and the turtle's speed limits are
      reduced: a tenth of its linear speed, a quarter of its turn rate. It
      starts at 0 % and ends once the battery is back at 5 %. The way out
      is the charging pad.
    alerts:
      crawling:
        name: The turtle crawls on an empty battery
        severity: warning
        condition: { fire_at: true }

  # --- Where the turtle is ------------------------------------------------------
  cell_x:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: cell_x
    rate_throttle_hz: 2
    description: |
      The x of the cell the turtle's centre is in, 0 to 255, counted from
      the west edge. A cell is 0.1 m wide.
    numeric:
      decimals: 0

  cell_y:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: cell_y
    rate_throttle_hz: 2
    description: |
      The y of the cell the turtle's centre is in, 0 to 255, counted from
      the south edge. A cell is 0.1 m wide.
    numeric:
      decimals: 0

  square:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: square
    rate_throttle_hz: 2
    description: |
      The square the turtle is in, A1 to P16. The letter follows x from
      west to east, the number y from south to north, as on a chess board.
      A square is 16 x 16 cells, 1.6 m wide.

  heading:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: heading_deg
    rate_throttle_hz: 2
    description: |
      Where the turtle looks, in degrees from 0 to 360. 0 is east, 90 is
      north, 180 west, 270 south: counter-clockwise, as ROS counts yaw.
    numeric:
      unit: "°"
      decimals: 0

  speed:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: speed
    rate_throttle_hz: 2
    description: |
      Speed along the heading in m/s, negative when the turtle drives
      backwards. At most 0.5 either way; 0.05 while it crawls.
    numeric:
      unit: m/s
      decimals: 2

  mode:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: mode
    rate_throttle_hz: 2
    description: |
      What the turtle is doing, as one word. `docking`: a dock runs.
      `auto`: a drive_to or drive_to_square runs. `teleop`: a velocity
      command other than zero arrived within the last 0.5 s. `charging`:
      it stands on the charging pad below 100 %. `idle`: none of these.

  odometer:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: odometer_m
    description: |
      Distance driven since the simulator started or was last reset, in
      metres, forwards and backwards alike. It only grows, until a reset
      puts it back to zero. The simulated odometry is exact.
    numeric:
      unit: m
      decimals: 1
    retention:
      enabled: true
      interval_seconds: 60

  # --- What is in the way -------------------------------------------------------
  bumper:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: bumper
    description: |
      True while the turtle pushed against a wall, a rock, water or the
      edge of the world within the last 0.2 s. It does not slide along an
      obstacle: back off or turn.

  collisions:
    topic: /turtle/status
    type: fleetless_turtle_msgs/msg/TurtleStatus
    field: collisions
    rate_throttle_hz: 2
    description: |
      How often the bumper has gone from false to true since the simulator
      started or was last reset. One long push counts once.
    numeric:
      decimals: 0
    chart:
      style: step

  range_front:
    topic: /range/front
    type: sensor_msgs/msg/Range
    field: range
    description: |
      Distance in metres from the turtle's centre to the nearest obstacle
      straight ahead, 0.1 to 4.0. 4.0 means nothing is in range. The
      turtle itself reaches 0.1 m from its centre, so 0.1 is contact.
    numeric:
      unit: m
      decimals: 2
    alerts:
      obstacle_ahead:
        name: Obstacle ahead
        severity: warning
        condition: { fire_at: 0.3, resolve_at: 0.5 }

  range_left:
    topic: /range/left
    type: sensor_msgs/msg/Range
    field: range
    description: |
      Distance in metres from the turtle's centre to the nearest obstacle
      on its left, at 90 degrees to the heading, 0.1 to 4.0. 4.0 means
      nothing is in range.
    numeric:
      unit: m
      decimals: 2

  range_right:
    topic: /range/right
    type: sensor_msgs/msg/Range
    field: range
    description: |
      Distance in metres from the turtle's centre to the nearest obstacle
      on its right, at 90 degrees to the heading, 0.1 to 4.0. 4.0 means
      nothing is in range.
    numeric:
      unit: m
      decimals: 2

  scan:
    topic: /scan
    type: sensor_msgs/msg/LaserScan
    rate_throttle_hz: 2
    description: |
      The laser scan, as the whole message. `ranges` holds 72 distances in
      metres from the turtle's centre, 5 degrees apart: index 0 looks
      straight back, index 18 to the right, index 36 straight ahead, index
      54 to the left. A ray that hit nothing within 4.0 m is null.

  # --- The model ----------------------------------------------------------------
  joint_states:
    topic: /joint_states
    type: sensor_msgs/msg/JointState
    description: |
      How the turtle's model stands, as the whole message: `name` lists its
      five joints, `position` their angles in radians, in the same order.
      `head_joint` turns the head into a curve, to the left for a positive
      angle, by 0.52 rad (30 degrees) at most. The four legs,
      `leg_front_left_joint`, `leg_front_right_joint`, `leg_hind_left_joint`
      and `leg_hind_right_joint`, swing forwards for a positive angle, by
      0.45 rad either way, once for every 0.25 m their side has walked. The
      console's Model page moves the URDF with it.

publishers:
  drive:
    topic: /cmd_vel
    type: geometry_msgs/msg/Twist
    description: |
      Drives the turtle by hand: a speed along its heading and a turn rate.
      One message is good for half a second, so send it about ten times a
      second for as long as the turtle should move; when the messages stop,
      the turtle stops. It speeds up and slows down at 1 m/s² and
      6 rad/s², never drives into an obstacle, and crawls on an empty
      battery whatever is asked of it.
    message:
      linear:
        x: ${linear_speed}
        y: 0.0
        z: 0.0
      angular:
        x: 0.0
        y: 0.0
        z: ${angular_speed}
    parameters:
      linear_speed:
        type: float64
        min_value: -0.5
        max_value: 0.5
        default: 0.0
        description: Speed along the heading in m/s. Negative drives backwards.
      angular_speed:
        type: float64
        min_value: -2.0
        max_value: 2.0
        default: 0.0
        description: Turn rate in rad/s. Positive turns left, counter-clockwise.
    # The bridge's own stop, should the cloud or the app fall silent. The
    # simulator has a second one of its own, 0.5 s after the last /cmd_vel.
    failsafe:
      timeout_ms: 500
      message:
        linear: { x: 0.0, y: 0.0, z: 0.0 }
        angular: { x: 0.0, y: 0.0, z: 0.0 }
    quiet_timeout_ms: 2000

# One request, one reply. The reply's `success` says whether it was done and
# `message` says so in a sentence. The turtle checks the arguments itself as
# well: a caller inside ROS has no cloud in front of it.
services:
  reset:
    ros_name: /turtle/reset
    type: std_srvs/srv/Trigger
    description: |
      Puts everything back to the start: the turtle on the charging pad in
      square A1, heading east, the battery at 100 %, the map as loaded,
      the trail off and empty, odometer and collisions at zero. A goal
      that runs ends with the reason `reset`. Always succeeds.

  teleport:
    ros_name: /turtle/teleport
    type: fleetless_turtle_msgs/srv/Teleport
    description: |
      Puts the turtle on the centre of a cell, standing, with a heading.
      Declined, with `success: false` and a sentence that says why, where
      the turtle does not fit: on a wall, a rock or water, and on a cell
      right beside one. Battery, odometer and trail stay as they are. A
      goal that runs ends with the reason `teleported`.
    message:
      x: ${cell_x}
      y: ${cell_y}
      heading_deg: ${heading_deg}
    parameters:
      cell_x:
        type: int32
        min_value: 0
        max_value: 255
        description: The cell's x, 0 to 255 from the west edge. The same count the datapoint cell_x reports.
      cell_y:
        type: int32
        min_value: 0
        max_value: 255
        description: The cell's y, 0 to 255 from the south edge. The same count the datapoint cell_y reports.
      heading_deg:
        type: float32
        min_value: 0
        max_value: 360
        default: 0
        description: Where the turtle looks afterwards. 0 is east, 90 north, counter-clockwise.

  set_block:
    ros_name: /turtle/set_block
    type: fleetless_turtle_msgs/srv/SetBlock
    description: |
      Puts a rock on a cell, or frees the cell, whatever it was: a wall
      and water can be freed too. Declined, with `success: false` and a
      sentence, on a cell of the charging pad and on a cell the turtle
      touches; it is two cells wide. A turtle on its way to a goal looks
      at its path at once and plans again if the rock is in it. `reset`
      brings the map back as it was loaded.
    message:
      x: ${cell_x}
      y: ${cell_y}
      occupied: ${occupied}
    parameters:
      cell_x:
        type: int32
        min_value: 0
        max_value: 255
        description: The cell's x, 0 to 255 from the west edge. The same count the datapoint cell_x reports.
      cell_y:
        type: int32
        min_value: 0
        max_value: 255
        description: The cell's y, 0 to 255 from the south edge. The same count the datapoint cell_y reports.
      occupied:
        type: bool
        default: true
        description: True puts a rock on the cell, false frees it.

  set_trail:
    ros_name: /turtle/set_trail
    type: std_srvs/srv/SetBool
    description: |
      Switches the trail on or off. While it is on, the turtle records
      where it has been, a point every 0.1 m, the newest 2000, and the
      view draws them. Switching it off clears it, and so does `reset`.
      The reply's `message` says which it is now.
    message:
      data: ${record}
    parameters:
      record:
        type: bool
        description: True records the trail, false stops and clears it.

# A goal takes time, reports on the way and can be cancelled. Every goal is
# accepted and answered through its result: `success`, a `reason` from the
# list below and a `message` of one sentence. One goal moves the turtle at a
# time, across all three actions.
#
#   reached           it stands on the target                       succeeded
#   charged           dock: the battery has reached the target      succeeded
#   out_of_range      no such cell, no such square, no such charge  aborted
#   target_occupied   the target blocks, or the turtle does not fit aborted
#   unreachable       no path leads there                           aborted
#   stuck             no progress for five seconds                  aborted
#   preempted         another goal was started                      aborted
#   teleop_override   a `drive` command other than zero arrived     aborted
#   teleported        `teleport` moved the turtle                   aborted
#   reset             `reset` was called                            aborted
#   canceled          the caller cancelled                          canceled
actions:
  drive_to:
    ros_name: /turtle/drive_to
    type: fleetless_turtle_msgs/action/DriveTo
    description: |
      Drives the turtle to the centre of a cell and stops there. It plans
      a path round walls, rocks and water, keeps 0.05 m of room, turns on
      the spot and drives at up to 0.5 m/s; across the garden takes about
      a minute. Feedback comes twice a second: `phase` (planning,
      driving, replanning), the cell it is in, `remaining_m` along the
      path and `progress` from 0 to 1. The result carries `success`,
      `reason`, a `message` of one sentence, the cell where it ended,
      `distance_m` and `duration_s`. Reasons: reached, target_occupied
      (the cell blocks, or the turtle does not fit beside what does),
      unreachable, stuck, preempted (a drive_to_square or a dock was
      started), teleop_override (a `drive` command other than zero
      arrived), teleported, reset, canceled. A cancel brakes the turtle
      and ends the goal within 2 s. A zero `drive` command ends nothing.
    message:
      x: ${cell_x}
      y: ${cell_y}
    parameters:
      cell_x:
        type: int32
        min_value: 0
        max_value: 255
        description: The target cell's x, 0 to 255 from the west edge. The same count the datapoint cell_x reports.
      cell_y:
        type: int32
        min_value: 0
        max_value: 255
        description: The target cell's y, 0 to 255 from the south edge. The same count the datapoint cell_y reports.

  drive_to_square:
    ros_name: /turtle/drive_to_square
    type: fleetless_turtle_msgs/action/DriveToSquare
    description: |
      Drives the turtle into a square, A1 to P16: to the cell nearest to
      the square's centre that it fits on. The letter follows x from west
      to east, the number y from south to north; the charging pad is in
      A1. Everything else is as for drive_to: the same feedback, the same
      result, the same reasons, and `target_occupied` if the whole square
      is wall, rock or water. A drive_to or a dock that is started while
      this runs ends it with `preempted`.
    message:
      square: ${square}
    parameters:
      square:
        type: string
        regex: "^[A-P]([1-9]|1[0-6])$"
        description: The square's name, a letter A to P and a number 1 to 16, like C7.

  dock:
    ros_name: /turtle/dock
    type: fleetless_turtle_msgs/action/Dock
    description: |
      Drives the turtle onto the charging pad in square A1 and waits there
      until the battery has reached `target_percent`; a full charge from
      empty takes one minute. It succeeds at once if the battery is
      already there on arrival. Feedback comes twice a second: `phase`
      (driving, charging), `battery_percent` and `remaining_m`. The result
      carries `success`, `reason`, a `message` of one sentence,
      `battery_percent` and `duration_s`. Reasons: charged, unreachable,
      stuck, preempted, teleop_override, teleported, reset, canceled.
    message:
      target_percent: ${target_percent}
    parameters:
      target_percent:
        type: float32
        min_value: 1
        max_value: 100
        default: 100
        description: The charge to wait for on the pad, in percent.

cameras:
  # Both are drawn inside the container, on the CPU, ten times a second.
  top:
    source:
      kind: ros
      topic: /turtle/camera/top/image_raw
      type: sensor_msgs/msg/Image
    width: 480
    height: 480
    fps: 10
    bitrate_kbps: 800
    snapshot_interval_seconds: 5
    description: |
      The garden from above with the turtle in the middle of the picture,
      north up: a window of 12 m by 12 m, 0.025 m a pixel, so a cell is 4
      pixels and a square 64. Lawn is green, a wall cream, a rock grey,
      water blue, the charging pad yellow with a bolt; past the garden's
      edge the picture is dark green. Thin lines part the squares, and each
      square's name stands in its north-west corner. The turtle is the dark
      green dot on the pale disc, and the arrowhead beside the disc points
      where it looks. A violet line is the path it plans to drive, with a
      ring on the target; an orange line is the trail it has left.
  eye:
    source:
      kind: ros
      topic: /turtle/camera/eye/image_raw
      type: sensor_msgs/msg/Image
    width: 320
    height: 240
    fps: 10
    bitrate_kbps: 500
    snapshot_interval_seconds: 5
    description: |
      What the turtle sees: the view along its heading from 0.1 m above the
      floor, 70 degrees wide, up to 8 m; what is further away is haze. A
      wall is a cream face 0.3 m tall, a rock a grey one half as tall,
      water is blue and flat on the floor, the charging pad yellow. A face
      is paler the further away it is, and darker where it looks away from
      the sun in the south-west. The floor's tiles are the cells, 0.1 m
      each. Left in the picture is left of the turtle.
